<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F4F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1420" media="(prefers-color-scheme: dark)">
<title>سبّح</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400&family=Noto+Naskh+Arabic:wght@600&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: one column at thumb width — dhikr, canopy, count, primary action; settings below the fold */
:root{
  --ground:#F2F4F3;      /* courtyard marble, cool */
  --vein:#E2E6E5;        /* marble veining, empty canopy */
  --surface:#FAFBFA;     /* raised marble slab */
  --membrane:#FFFDF6;    /* canopy fabric */
  --membrane-2:#F4EEE1;  /* canopy panel in shade */
  --bronze:#86633A;      /* columns, primary action */
  --bronze-soft:#EADFCC;
  --on-bronze:#FFFFFF;
  --ink:#1B2838;         /* shade-blue text */
  --muted:#556476;
  --line:#D6D2C8;
  --raised:#FFFFFF;
  --shade:rgba(27,40,56,.16);
  --ok:#2F6B4F;

  --f-ui:"Almarai","Segoe UI",Tahoma,sans-serif;
  --f-dhikr:"Noto Naskh Arabic","Traditional Arabic","Times New Roman",serif;
  --f-num:"Reem Kufi","Almarai",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1420; --vein:#1A2534; --surface:#141E2C; --membrane:#ECE6D8; --membrane-2:#D9D0BD;
    --bronze:#C9A06A; --bronze-soft:#2A2A2A; --on-bronze:#0D1420; --ink:#EDF0F3; --muted:#9BA8B8;
    --line:#26313F; --raised:#2B3A4E; --shade:rgba(0,0,0,.45); --ok:#7FC8A0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0D1420; --vein:#1A2534; --surface:#141E2C; --membrane:#ECE6D8; --membrane-2:#D9D0BD;
  --bronze:#C9A06A; --bronze-soft:#2A2A2A; --on-bronze:#0D1420; --ink:#EDF0F3; --muted:#9BA8B8;
  --line:#26313F; --raised:#2B3A4E; --shade:rgba(0,0,0,.45); --ok:#7FC8A0; color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent;overflow:hidden}
::selection{background:var(--bronze);color:var(--on-bronze)}
:focus-visible{outline:2px solid var(--bronze);outline-offset:6px;border-radius:12px}
main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(16px,4vh,36px);padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
.dhikr{font-family:var(--f-dhikr);font-weight:600;font-size:clamp(30px,9vw,46px);line-height:1.5;text-align:center;text-wrap:balance;min-height:1.5em;transition:opacity .25s}
.canopy{display:block;width:min(78vw,52vh,380px);aspect-ratio:1;max-width:100%}
.canopy canvas{width:100%;height:100%;display:block}
.tally{display:flex;align-items:baseline;gap:8px;font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr}
.tally .n{font-weight:700;font-size:clamp(64px,18vw,96px);line-height:1}
.tally .of{font-weight:500;font-size:clamp(18px,5vw,24px);color:var(--muted)}
.tally.done .n{color:var(--ok)}
.hint{position:fixed;inset:auto 0 0;padding:0 16px calc(18px + env(safe-area-inset-bottom,0px));margin:0;text-align:center;font-size:13px;color:var(--muted);transition:opacity .4s}
.hint.off{opacity:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <button class="dhikr" id="dhikr" aria-label="الذكر التالي"></button>
  <button class="canopy" id="canopy" aria-label="ابدأ أو أوقف العدّ بالصوت"><canvas id="cv"></canvas></button>
  <div class="tally" id="tally" aria-live="polite"><span class="n" id="count">0</span><span class="of" id="target">/ 33</span></div>
</main>
<p class="hint" id="hint">اضغط المظلّة للبدء · الذكر لتغييره · مطوّلاً للتصفير</p>
<script>
(() => {
  const LIST = [
    {s:"سبحان الله", t:"سُبْحَانَ اللَّهِ", n:33},
    {s:"الحمد لله", t:"الْحَمْدُ لِلَّهِ", n:33},
    {s:"الله أكبر", t:"اللَّهُ أَكْبَرُ", n:34},
    {s:"أستغفر الله", t:"أَسْتَغْفِرُ اللَّهَ", n:100},
    {s:"لا إله إلا الله", t:"لَا إِلَٰهَ إِلَّا اللَّهُ", n:100},
    {s:"سبحان الله وبحمده", t:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", n:100},
    {s:"لا حول ولا قوة إلا بالله", t:"لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ", n:100},
    {s:"الصلاة على النبي", t:"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ", n:100},
  ];
  const $ = id => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const store = {
    get(k,d){ try{ const v=localStorage.getItem("sabbih_"+k); return v===null?d:JSON.parse(v);}catch(e){return d} },
    set(k,v){ try{ localStorage.setItem("sabbih_"+k,JSON.stringify(v)); }catch(e){} }
  };
  let idx = Math.max(0, Math.min(store.get("idx",0), LIST.length-1));
  let count = store.get("count",0);
  let done = count >= LIST[idx].n;
  let listening = false;
  const cur = () => LIST[idx];
  const save = () => { store.set("idx",idx); store.set("count",count); };

  // ── the canopy ──
  const cv=$("cv"), cx=cv.getContext("2d");
  const RIBS=16;
  const canopy = { fill:0, fillTo:0, open:.8, openTo:.8, bloom:0 };
  let colors={};
  function readColors(){
    const cs=getComputedStyle(document.documentElement);
    for(const k of ["vein","membrane","membrane-2","bronze","shade","ground","line"]) colors[k]=cs.getPropertyValue("--"+k).trim();
  }
  function sizeCanvas(){
    const r=cv.getBoundingClientRect(), d=Math.min(window.devicePixelRatio||1,3);
    cv.width=Math.round(r.width*d); cv.height=Math.round(r.height*d);
    cx.setTransform(d,0,0,d,0,0);
    draw();
  }
  // square-ish canopy seen from above: rib tips reach the corners, sides bow inward between ribs
  function tip(i,R){
    const a=-Math.PI/2 + i*2*Math.PI/RIBS;
    const c=Math.cos(a), s=Math.sin(a);
    const r=Math.min(R, R*0.80/Math.max(Math.abs(c),Math.abs(s)));
    return [c*r, s*r];
  }
  function edgeCtrl(p,q){ const mx=(p[0]+q[0])/2, my=(p[1]+q[1])/2; return [mx*0.93,my*0.93]; }
  function panel(i,R,f){
    const p=tip(i,R), q=tip(i+1,R), c=edgeCtrl(p,q);
    cx.beginPath(); cx.moveTo(0,0); cx.lineTo(p[0],p[1]);
    if(f>=1){ cx.quadraticCurveTo(c[0],c[1],q[0],q[1]); }
    else {
      const c1=[p[0]+(c[0]-p[0])*f, p[1]+(c[1]-p[1])*f];
      const e=[(1-f)*(1-f)*p[0]+2*(1-f)*f*c[0]+f*f*q[0], (1-f)*(1-f)*p[1]+2*(1-f)*f*c[1]+f*f*q[1]];
      cx.quadraticCurveTo(c1[0],c1[1],e[0],e[1]);
    }
    cx.closePath();
  }
  function outline(R){
    cx.beginPath();
    for(let i=0;i<RIBS;i++){ const p=tip(i,R), q=tip(i+1,R), c=edgeCtrl(p,q); if(i===0) cx.moveTo(p[0],p[1]); cx.quadraticCurveTo(c[0],c[1],q[0],q[1]); }
    cx.closePath();
  }
  function draw(){
    const w=cv.clientWidth, h=cv.clientHeight; if(!w) return;
    cx.clearRect(0,0,w,h);
    const R0=w*0.46;
    const R=R0*(0.42+0.58*canopy.open)*(1+canopy.bloom*0.035);
    cx.save(); cx.translate(w/2,h/2);

    // shade cast on the marble
    cx.save(); cx.translate(0,R0*0.06); cx.filter="blur("+Math.max(4,R*0.07)+"px)";
    outline(R*0.98); cx.fillStyle=colors.shade; cx.globalAlpha=0.35+0.65*Math.min(1,canopy.fill*1.4); cx.fill(); cx.restore();
    cx.filter="none";

    // empty canopy
    outline(R); cx.fillStyle=colors.vein; cx.fill();

    // fabric, panel by panel, as the count grows
    const fp=canopy.fill*RIBS;
    for(let i=0;i<RIBS;i++){
      const f=Math.max(0,Math.min(1,fp-i)); if(f<=0) break;
      panel(i,R,f); cx.fillStyle = i%2 ? colors["membrane-2"] : colors.membrane; cx.fill();
    }
    // ribs
    cx.strokeStyle=colors.bronze; cx.lineCap="round";
    for(let i=0;i<RIBS;i++){
      const p=tip(i,R); cx.globalAlpha = i%4===0 ? .9 : .45; cx.lineWidth = i%4===0 ? 1.6 : 1;
      cx.beginPath(); cx.moveTo(0,0); cx.lineTo(p[0],p[1]); cx.stroke();
    }
    cx.globalAlpha=1;
    // rim
    outline(R); cx.lineWidth=1; cx.strokeStyle=colors.bronze; cx.globalAlpha=.55; cx.stroke(); cx.globalAlpha=1;
    // crown
    cx.beginPath(); cx.arc(0,0,R0*0.07,0,Math.PI*2); cx.fillStyle=colors.bronze; cx.fill();
    cx.beginPath(); cx.arc(0,0,R0*0.03,0,Math.PI*2); cx.fillStyle=colors.ground; cx.fill();
    cx.restore();
  }
  let raf=0, last=0;
  function animate(t){
    const dt=Math.min(64,t-(last||t)); last=t;
    const k=1-Math.exp(-dt/(reduce?1:90));
    const ko=1-Math.exp(-dt/(reduce?1:160));
    canopy.fill += (canopy.fillTo-canopy.fill)*k;
    canopy.open += (canopy.openTo-canopy.open)*ko;
    canopy.bloom *= reduce?0:Math.exp(-dt/260);
    draw();
    const moving = Math.abs(canopy.fillTo-canopy.fill)>.0005 || Math.abs(canopy.openTo-canopy.open)>.001 || canopy.bloom>.002;
    raf = moving ? requestAnimationFrame(animate) : 0;
    if(!moving){ last=0; }
  }
  function kick(){ if(!raf){ last=0; raf=requestAnimationFrame(animate); } }

  // ── interface ──
  function render(){
    $("dhikr").textContent=cur().t;
    $("count").textContent=String(count);
    $("target").textContent="/ "+cur().n;
    $("tally").classList.toggle("done",done);
    $("canopy").setAttribute("aria-pressed",listening);
    canopy.fillTo=Math.min(1,count/cur().n);
    canopy.openTo= listening||done ? 1 : 0.8;
    kick();
  }
  let hintTimer=0;
  function hint(t){ const h=$("hint"); h.textContent=t; h.classList.remove("off"); clearTimeout(hintTimer); hintTimer=setTimeout(()=>h.classList.add("off"),4000); }
  function buzz(ms){ try{ navigator.vibrate&&navigator.vibrate(ms); }catch(e){} }

  // ── counting ──
  function add(n){
    if(done) return;
    for(let i=0;i<n;i++){ count++; if(count>=cur().n){ finish(); break; } }
    if(!done) buzz(22);
    render(); save();
  }
  function finish(){
    done=true; buzz([260,90,260]); canopy.bloom=1;
    if(idx<2) setTimeout(()=>select(idx+1),1400);   // أذكار بعد الصلاة: ٣٣ ثم ٣٣ ثم ٣٤
    else if(listening) stop();
  }
  function select(i){
    idx=i; count=0; done=false; canopy.fill=0;
    render(); save();
  }

  // ── burst mode: each utterance between pauses is one count ──
  const burst = {
    ctx:null, stream:null, timer:null, sens:60,
    async start(){
      this.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:true,autoGainControl:false}});
      this.ctx=new (window.AudioContext||window.webkitAudioContext)();
      const an=this.ctx.createAnalyser(); an.fftSize=1024;
      this.ctx.createMediaStreamSource(this.stream).connect(an);
      const buf=new Float32Array(an.fftSize);
      let floor=null,warm=0,inSp=false,spF=0,loudF=0,sil=0;
      const GAP=11,MIN=13,lens=[];
      this.timer=setInterval(()=>{
        an.getFloatTimeDomainData(buf);
        let s=0; for(let i=0;i<buf.length;i++) s+=buf[i]*buf[i];
        const db=20*Math.log10(Math.sqrt(s/buf.length)+1e-6);
        if(floor===null) floor=db;
        if(warm<25){ floor=floor*.8+db*.2; warm++; return; }
        const loud = db > floor+(22-this.sens*.16);
        if(!inSp){
          floor = db<floor ? floor*.9+db*.1 : floor*.995+db*.005;
          if(loud){ if(++loudF>=3){ inSp=true; spF=loudF; sil=0; } } else loudF=0;
        } else {
          spF++; sil = loud?0:sil+1;
          if(sil>=GAP){
            const len=spF-sil;
            if(len>=MIN){
              let times=1;
              if(lens.length>=4){ const med=[...lens].sort((a,b)=>a-b)[lens.length>>1]; if(len>med*1.7) times=Math.max(1,Math.min(5,Math.round(len/med))); }
              if(times===1){ lens.push(len); if(lens.length>12) lens.shift(); }
              add(times);
            }
            inSp=false; loudF=0; spF=0; sil=0;
          }
        }
      },20);
    },
    stop(){
      clearInterval(this.timer); this.timer=null;
      this.stream&&this.stream.getTracks().forEach(t=>t.stop()); this.stream=null;
      this.ctx&&this.ctx.close().catch(()=>{}); this.ctx=null;
    }
  };

  // ── start / stop ──
  let wake=null;
  async function start(){
    if(!window.isSecureContext||!navigator.mediaDevices){ hint("الميكروفون يحتاج فتح الصفحة من رابط https"); return; }
    if(done) select(idx);
    try{ await burst.start(); }catch(e){ hint("اسمح للموقع باستخدام الميكروفون من إعدادات المتصفح"); return; }
    listening=true; $("hint").classList.add("off");
    try{ wake=await navigator.wakeLock?.request("screen"); }catch(e){}
    render();
  }
  function stop(){
    burst.stop(); listening=false;
    try{ wake&&wake.release(); }catch(e){} wake=null;
    render();
  }

  // ── gestures: tap canopy = listen, long-press canopy = reset, tap dhikr = next ──
  let pressT=0, longFired=false;
  const cvBtn=$("canopy");
  cvBtn.addEventListener("pointerdown",()=>{ longFired=false; pressT=setTimeout(()=>{ longFired=true; buzz(60); select(idx); },650); });
  ["pointerup","pointerleave","pointercancel"].forEach(e=>cvBtn.addEventListener(e,()=>clearTimeout(pressT)));
  cvBtn.addEventListener("click",()=>{ if(longFired) return; listening?stop():start(); });
  cvBtn.addEventListener("contextmenu",e=>e.preventDefault());
  $("dhikr").onclick=()=>{ if(listening) stop(); select((idx+1)%LIST.length); };

  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="visible"&&listening&&!wake) navigator.wakeLock?.request("screen").then(w=>wake=w).catch(()=>{});
  });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ readColors(); draw(); });
  new ResizeObserver(sizeCanvas).observe(cv);

  readColors();
  canopy.fill=canopy.fillTo=Math.min(1,count/cur().n);
  render(); sizeCanvas();
  if(store.get("seen",false)) $("hint").classList.add("off"); else { store.set("seen",true); setTimeout(()=>$("hint").classList.add("off"),7000); }
  if(document.fonts) document.fonts.ready.then(draw);
})();
</script>
</body>
</html>
